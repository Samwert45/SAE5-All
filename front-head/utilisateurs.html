<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilisateurs - Gestion</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <ul>
            <li><a href="connecteurs.html">Connecteurs</a></li>
            <li><a href="utilisateurs.html" class="active">Utilisateurs</a></li>
        </ul>
    </nav>

    <div class="container" id="utilisateurs-page">
        <h1>Gestion des Utilisateurs</h1>

        <div class="card">
            <h2>Ajouter un utilisateur</h2>

            <form id="user-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="exemple@email.com" required>
                </div>

                <div class="form-group">
                    <label for="importance">Niveau d'importance</label>
                    <select id="importance" required>
                        <option value="1">1 - Faible</option>
                        <option value="2">2 - Normal</option>
                        <option value="3" selected>3 - Moyen</option>
                        <option value="4">4 - Elevé</option>
                        <option value="5">5 - Critique</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">Ajouter l'utilisateur</button>
            </form>
        </div>

        <div class="card users-list">
            <h2>Utilisateurs enregistrés</h2>
            <div id="users-list">
                <p class="empty-state">Aucun utilisateur enregistré</p>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
